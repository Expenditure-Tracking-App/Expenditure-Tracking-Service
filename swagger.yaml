openapi: 3.0.3
info:
  title: Expenditure Tracking Bot API
  description: |
    REST API for the Expenditure Tracking Bot. This API allows you to manage expenses, view transaction history,
    and access pre-filled expense configurations.
  version: 1.0.0
  contact:
    name: API Support
    email: expenditure-tracking-app@googlegroups.com

servers:
  - url: http://localhost:8081
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Transactions
    description: Transaction management endpoints
  - name: Prefilled Expenses
    description: Pre-filled expense configurations

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the API server
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '405':
          description: Method not allowed

  /api/v1/transactions/:
    get:
      tags:
        - Transactions
      summary: Get transactions
      description: Retrieve transactions with optional filtering and pagination
      operationId: getTransactions
      parameters:
        - name: category
          in: query
          description: Filter transactions by category
          required: false
          schema:
            type: string
            example: Food
        - name: is_claimable
          in: query
          description: Filter transactions by claimable status
          required: false
          schema:
            type: boolean
            example: true
        - name: paid_for_family
          in: query
          description: Filter transactions by family payment status
          required: false
          schema:
            type: boolean
            example: false
        - name: page
          in: query
          description: Page number for pagination (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
      responses:
        '200':
          description: Successful response with transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionsResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Transactions
      summary: Create a transaction
      description: Create a new expense transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/{id}:
    put:
      tags:
        - Transactions
      summary: Update a transaction
      description: Update an existing transaction by ID
      operationId: updateTransaction
      parameters:
        - name: id
          in: path
          description: Transaction ID
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request body or transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/prefilled-expenses:
    get:
      tags:
        - Prefilled Expenses
      summary: Get pre-filled expenses
      description: Retrieve the list of pre-filled expense configurations
      operationId: getPrefilledExpenses
      responses:
        '200':
          description: Successful response with pre-filled expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrequentExpense'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          description: Server status
          example: OK
        timestamp:
          type: string
          format: date-time
          description: Server timestamp
          example: "2026-02-10T00:00:00Z"

    Transaction:
      type: object
      properties:
        id:
          type: integer
          description: Unique transaction ID
          example: 1
        name:
          type: string
          description: Transaction name/description
          example: Lunch
        amount:
          type: number
          format: double
          description: Transaction amount
          example: 15.50
        category:
          type: string
          description: Transaction category
          example: Food
        date:
          type: string
          format: date
          description: Transaction date
          example: "2026-02-10"
        is_claimable:
          type: boolean
          description: Whether the expense is claimable
          example: true
        paid_for_family:
          type: boolean
          description: Whether the expense was paid for family
          example: false

    CreateTransactionRequest:
      type: object
      required:
        - name
        - amount
        - category
        - date
      properties:
        name:
          type: string
          description: Transaction name/description
          example: Lunch
        amount:
          type: number
          format: double
          description: Transaction amount
          example: 15.50
        category:
          type: string
          description: Transaction category
          example: Food
        date:
          type: string
          format: date
          description: Transaction date
          example: "2026-02-10"
        is_claimable:
          type: boolean
          description: Whether the expense is claimable
          example: true
        paid_for_family:
          type: boolean
          description: Whether the expense was paid for family
          example: false

    UpdateTransactionRequest:
      type: object
      properties:
        name:
          type: string
          description: Transaction name/description
          example: Lunch
        amount:
          type: number
          format: double
          description: Transaction amount
          example: 15.50
        category:
          type: string
          description: Transaction category
          example: Food
        date:
          type: string
          format: date
          description: Transaction date
          example: "2026-02-10"
        is_claimable:
          type: boolean
          description: Whether the expense is claimable
          example: true
        paid_for_family:
          type: boolean
          description: Whether the expense was paid for family
          example: false

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          description: Response message
          example: Transaction created successfully

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: Invalid request body

    TransactionCategoryCount:
      type: object
      properties:
        category:
          type: string
          description: Category name
          example: Food
        count:
          type: integer
          description: Number of transactions in this category
          example: 5

    PaginatedTransactionsResponse:
      type: object
      properties:
        categories:
          type: array
          description: Transaction counts per category
          items:
            $ref: '#/components/schemas/TransactionCategoryCount'
        transactions:
          type: array
          description: List of transactions
          items:
            $ref: '#/components/schemas/Transaction'
        current_page:
          type: integer
          description: Current page number
          example: 1
        page_size:
          type: integer
          description: Number of items per page
          example: 10
        total_items:
          type: integer
          description: Total number of transactions
          example: 25
        total_pages:
          type: integer
          description: Total number of pages
          example: 3

    FrequentExpense:
      type: object
      properties:
        name:
          type: string
          description: Expense name
          example: Gym membership
        category:
          type: string
          description: Expense category
          example: Health
        is_claimable:
          type: boolean
          description: Whether the expense is claimable
          example: true